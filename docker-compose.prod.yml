# Supported topology: one host and one API replica. Terminate public TLS upstream.
services:
  elasticsearch:
    image: ${SANCTIONS_ES_IMAGE:-hybrid-sanctions-elasticsearch:local}
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set a dedicated Elasticsearch administrator password}
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks: [backend]
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'curl --silent --fail --user "elastic:$${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  provision:
    image: ${SANCTIONS_IMAGE:-hybrid-sanctions:local}
    build: .
    entrypoint: [python, -m, ai_service.scripts.provision_elasticsearch]
    environment:
      ES_HOSTS: http://elasticsearch:9200
      ES_USERNAME: elastic
      ES_PASSWORD: ${ELASTIC_PASSWORD:?Set Elasticsearch administrator password}
      ES_SERVICE_USERNAME: sanctions_service
      ES_SERVICE_PASSWORD: ${ES_SERVICE_PASSWORD:?Set a distinct service password of at least 32 characters}
      ES_INDEX_PREFIX: ${ES_INDEX_PREFIX:-sanctions}
    networks: [backend]
    depends_on:
      elasticsearch: {condition: service_healthy}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 256m

  ai-service:
    image: ${SANCTIONS_IMAGE:-hybrid-sanctions:local}
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      ENABLE_SEARCH: "true"
      ENABLE_EMBEDDINGS: "true"
      ENABLE_VARIANTS: ${ENABLE_VARIANTS:-true}
      ES_HOSTS: http://elasticsearch:9200
      ES_USERNAME: sanctions_service
      ES_PASSWORD: ${ES_SERVICE_PASSWORD:?Set a dedicated service password}
      ES_INDEX_PREFIX: ${ES_INDEX_PREFIX:-sanctions}
      ES_STARTUP_TIMEOUT: "90"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set a random admin API key of at least 32 characters}
      APP_STATE_DIR: /app/state
      XDG_CACHE_HOME: /app/cache
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-27262976}
      HTTP_MAX_INFLIGHT: ${HTTP_MAX_INFLIGHT:-4}
      HTTP_BODY_TIMEOUT_SECONDS: ${HTTP_BODY_TIMEOUT_SECONDS:-30}
      HTTP_PROCESSING_TIMEOUT_SECONDS: ${HTTP_PROCESSING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_PENDING: ${EMBEDDING_MAX_PENDING:-16}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      INGESTION_VERIFY_TIMEOUT_SECONDS: ${INGESTION_VERIFY_TIMEOUT_SECONDS:-300}
      VARIANTS_MAX_PENDING: ${VARIANTS_MAX_PENDING:-16}
      VARIANTS_TIMEOUT_SECONDS: ${VARIANTS_TIMEOUT_SECONDS:-30}
    volumes:
      - ingestion_state:/app/state
      - application_cache:/app/cache
      - application_logs:/app/logs
    networks: [backend, frontend]
    depends_on:
      provision: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: ${API_MEMORY_LIMIT_BYTES:-2147483648}
    healthcheck:
      test: [CMD, python, -m, ai_service.scripts.healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  backend: {internal: true}
  frontend: {}
volumes:
  elasticsearch_data: {}
  ingestion_state: {}
  application_cache: {}
  application_logs: {}
