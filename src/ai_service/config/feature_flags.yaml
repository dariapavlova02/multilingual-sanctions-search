# Feature flags configuration for AI normalization service
# Explicit deployment profiles for the canonical pipeline

development:
  feature_flags:
    fix_initials_double_dot: false
    preserve_hyphenated_case: false
    enable_ac_tier0: false
    enable_vector_fallback: false

staging:
  feature_flags:
    fix_initials_double_dot: true
    preserve_hyphenated_case: false
    enable_ac_tier0: true
    enable_vector_fallback: false
    require_tin_dob_gate: true

production:
  feature_flags:
    fix_initials_double_dot: false
    preserve_hyphenated_case: false
    enable_ac_tier0: false
    enable_vector_fallback: false
