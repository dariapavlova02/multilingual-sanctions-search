# Local runs use the same authenticated stack and image as production.
services:
  elasticsearch:
    extends: {file: docker-compose.prod.yml, service: elasticsearch}
  provision:
    extends: {file: docker-compose.prod.yml, service: provision}
  ai-service:
    extends: {file: docker-compose.prod.yml, service: ai-service}

networks:
  backend: {internal: true}
  frontend: {}
volumes:
  elasticsearch_data: {}
  ingestion_state: {}
  application_cache: {}
  application_logs: {}
